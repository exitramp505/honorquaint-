<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Honorquaint Quote</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    :root{
      --blue:#007bff;
      --blue-h:#0069d9;
      --green:#28a745;
      --green-h:#218838;
      --ink:#222;
      --muted:#586170;
      --bg:#f8f9fb;
      --radius:12px;
      --gap:10px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);
      color:var(--ink);
      text-align:center;
    }
    #app{
      max-width:600px;
      margin:0 auto;
      padding:1rem;
    }
    label{
      display:block;
      font-size:.9rem;
      color:#555;
      margin-bottom:.25rem;
      text-align:left;
    }
    .field{margin-bottom:var(--gap);}
    select,input{
      width:100%;
      font-size:1rem;
      padding:.45rem;
      border:1px solid #ccc;
      border-radius:8px;
      background:#fff;
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:var(--gap);
      margin-bottom:var(--gap);
    }

    .btnbar{
      display:flex;
      justify-content:center;
      gap:.4rem;
      flex-wrap:nowrap;
      margin-top:.7rem;
    }
    button{
      font-size:.95rem;
      padding:.55rem .85rem;
      border:none;
      border-radius:8px;
      cursor:pointer;
      color:#fff;
      font-weight:600;
      transition:background .2s ease;
      min-width:115px;
      flex:0 1 auto;
      white-space:nowrap;
    }
    #btnShare,#btnShareImg{background:var(--blue)}
    #btnShare:hover,#btnShareImg:hover{background:var(--blue-h)}
    #btnFetch{background:var(--green)}
    #btnFetch:hover{background:var(--green-h)}

    .meta{margin:.5rem 0 .3rem;color:#555;font-size:.92rem}

    .quote-card{
      margin-top:1rem;
      padding:1rem;
      border-radius:var(--radius);
      background:linear-gradient(to bottom,#ffffff 78%,#e8ebf0 100%);
      box-shadow:0 0 8px rgba(0,0,0,.1);
      text-align:center;
    }
    .quote-main .line{margin:6px 0}
    .quote-main .big{font-weight:700}
    .quote-main .huge{font-size:1.6rem;font-weight:800}
    .quote-main .muted{color:var(--muted)}


    .field-head{margin-bottom:.25rem}
    .field-head label{margin-bottom:0}

    .input-with-action{
      position:relative;
      display:block;
    }

    .input-with-action input{
      padding-right:3rem;
    }

    .add-amount{
      position:absolute;
      top:50%;
      right:.45rem;
      transform:translateY(-50%);
      min-width:0;
      width:30px;
      height:30px;
      padding:0;
      margin:0;
      border-radius:50%;
      background:var(--blue);
      color:#fff;
      font-size:1.25rem;
      font-weight:500;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .add-amount span{
      display:block;
      line-height:1;
      transform:translateY(-1px);
    }

    .amount-list{display:grid;gap:8px}
    .amount-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
    .amount-row:first-child{display:block}
    .amount-row input{min-width:0}

    .remove-amount{
      min-width:0;
      width:34px;
      height:34px;
      padding:0;
      margin:0;
      border-radius:8px;
      background:#dc3545;
      color:#fff;
      font-size:1.1rem;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .amount-total{
      display:none;
      margin-top:7px;
      text-align:right;
      color:var(--muted);
      font-size:.88rem;
      font-weight:600;
    }
    .amount-total.show{display:block}

    @media (max-width:380px){
      .btnbar button{padding:.45rem .6rem;min-width:100px;font-size:.9rem}
      .grid2{gap:8px}
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Row 1: Asset | Mode -->
    <div class="grid2">
      <div class="field">
        <label for="assetSel">Asset</label>
        <select id="assetSel">
          <option value="BTC">BTC</option>
          <option value="LTC">LTC</option>
          <option value="SOL">SOL</option>
          <option value="XMR">XMR</option>
          <option value="ETH">ETH</option>
          <option value="USDT">USDT</option>
        </select>
      </div>
      <div class="field">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="sell_usdToAsset">Sell • USD → Asset</option>
          <option value="sell_assetToUsd">Sell • Asset → USD</option>
          <option value="buy_usdToAsset">Buy • USD → Asset</option>
          <option value="buy_assetToUsd">Buy • Asset → USD</option>
        </select>
      </div>
    </div>

    <!-- Row 2: Upcharge | Fee -->
    <div class="grid2">
      <div class="field">
        <label for="upcharge">Upcharge (%)</label>
        <input id="upcharge" type="number" value="6" step="0.1" />
      </div>
      <div class="field">
        <label for="txfee">Transaction Fee (USD)</label>
        <input id="txfee" type="number" value="1.5" step="0.5" />
      </div>
    </div>

    <!-- Row 3: Amount / Spot -->
    <div id="usdWrap" class="field">
      <div class="field-head">
        <label id="usdLabel" for="amtusd">Amount (USD)</label>
      </div>
      <div id="usdAmounts" class="amount-list">
        <div class="amount-row">
          <div class="input-with-action">
            <input id="amtusd" class="amount-input usd-amount" type="number" inputmode="decimal" placeholder="Enter USD amount" />
            <button type="button" class="add-amount" id="addUsdAmount" aria-label="Add another USD amount"><span>+</span></button>
          </div>
        </div>
      </div>
      <div id="usdTotalWrap" class="amount-total">Total: $<span id="usdTotal">0.00</span></div>
    </div>

    <div id="btcWrap" class="field" style="display:none">
      <div class="field-head">
        <label id="btcLabel" for="amtbtc">Amount (Asset)</label>
      </div>
      <div id="assetAmounts" class="amount-list">
        <div class="amount-row">
          <div class="input-with-action">
            <input id="amtbtc" class="amount-input asset-amount" type="number" inputmode="decimal" placeholder="Enter asset amount" />
            <button type="button" class="add-amount" id="addAssetAmount" aria-label="Add another asset amount"><span>+</span></button>
          </div>
        </div>
      </div>
      <div id="assetTotalWrap" class="amount-total">Total: <span id="assetTotal">0.00000</span></div>
    </div>

    <div class="field">
      <label for="spot">Spot Price</label>
      <input id="spot" type="number" step="any" />
    </div>

    <div class="meta">
      <span id="priceStatus">Waiting for price...</span><br />
      Auto-refresh <span id="refreshCountdown">60</span>s
    </div>

    <div class="btnbar">
      <button id="btnShare">Share Text</button>
      <button id="btnShareImg">Share Image</button>
      <button id="btnFetch">Refresh</button>
    </div>

    <div id="quoteCard" class="quote-card">
      <div id="qBox"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const $ = id => document.getElementById(id);

      const moneyTrim = n => {
        if (!isFinite(n)) return '—';
        const fixed = Number(n).toFixed(2);
        return `$${fixed.replace(/\.00$/, '').replace(/(\.\d)0$/, '$1')}`;
      };

      const fmtMoney = n => isFinite(n) ? `$${Number(n).toFixed(2)}` : '—';

      const fmtAsset = (n, asset) => {
        if (!isFinite(n)) return '—';
        return Number(n).toFixed(asset === 'USDT' ? 2 : 5);
      };

      const sumInputs = selector => [...document.querySelectorAll(selector)]
        .reduce((total, input) => total + (parseFloat(input.value) || 0), 0);

      const ASSET_PAIRS = {
        BTC:'XXBTZUSD',
        LTC:'XLTCZUSD',
        SOL:'SOLUSD',
        XMR:'XXMRZUSD',
        ETH:'XETHZUSD',
        USDT:'USDTZUSD'
      };

      let countdown = 60;
      let timer;
      let lastShareTitle = 'Quote';

      // Store the current calculated values for clean share text.
      let currentQuote = {
        side: 'sell',
        asset: 'BTC',
        usdAmount: 0,
        assetAmount: 0,
        rateText: '—',
        up: 6,
        feeText: '$1.50',
        lineOneText: '',
        lineTwoText: ''
      };

      const STORAGE_KEYS = {
        asset: 'honorquaint.asset',
        mode: 'honorquaint.mode',
        upcharge: 'honorquaint.upcharge',
        txfee: 'honorquaint.txfee'
      };

      function savePreferences(){
        localStorage.setItem(STORAGE_KEYS.asset, $('assetSel').value);
        localStorage.setItem(STORAGE_KEYS.mode, $('mode').value);
        localStorage.setItem(STORAGE_KEYS.upcharge, $('upcharge').value);
        localStorage.setItem(STORAGE_KEYS.txfee, $('txfee').value);
      }

      function restorePreferences(){
        const savedAsset = localStorage.getItem(STORAGE_KEYS.asset);
        const savedMode = localStorage.getItem(STORAGE_KEYS.mode);
        const savedUpcharge = localStorage.getItem(STORAGE_KEYS.upcharge);
        const savedFee = localStorage.getItem(STORAGE_KEYS.txfee);

        if (savedAsset && [...$('assetSel').options].some(o => o.value === savedAsset)) $('assetSel').value = savedAsset;
        if (savedMode && [...$('mode').options].some(o => o.value === savedMode)) $('mode').value = savedMode;
        if (savedUpcharge !== null && savedUpcharge !== '') $('upcharge').value = savedUpcharge;
        if (savedFee !== null && savedFee !== '') $('txfee').value = savedFee;
      }

      function updateAmountTotalsVisibility(){
        $('usdTotalWrap').classList.toggle('show', document.querySelectorAll('.usd-amount').length > 1);
        $('assetTotalWrap').classList.toggle('show', document.querySelectorAll('.asset-amount').length > 1);
      }

      function addAmountInput(type){
        const isUsd = type === 'usd';
        const list = $(isUsd ? 'usdAmounts' : 'assetAmounts');
        const row = document.createElement('div');
        row.className = 'amount-row';

        const input = document.createElement('input');
        input.type = 'number';
        input.inputMode = 'decimal';
        input.className = `amount-input ${isUsd ? 'usd-amount' : 'asset-amount'}`;
        input.placeholder = isUsd ? 'Enter another USD amount' : 'Enter another asset amount';
        input.addEventListener('input', calc);

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove-amount';
        remove.setAttribute('aria-label', 'Remove amount');
        remove.textContent = '×';
        remove.addEventListener('click', () => {
          row.remove();
          updateAmountTotalsVisibility();
          calc();
        });

        row.append(input, remove);
        list.appendChild(row);
        updateAmountTotalsVisibility();
        input.focus();
      }

      function getModeState(){
        const mode = $('mode').value;
        const isBuy = mode.startsWith('buy_');
        const isUsdInput = mode.endsWith('usdToAsset');
        return { mode, side: isBuy ? 'buy' : 'sell', isUsdInput };
      }

      function syncMode(){
        const { side, isUsdInput } = getModeState();
        $('usdWrap').style.display = isUsdInput ? 'block' : 'none';
        $('btcWrap').style.display = isUsdInput ? 'none' : 'block';

        $('usdLabel').textContent = side === 'sell' ? 'Amount (USD)' : 'Receive Amount (USD)';
        $('amtusd').placeholder = side === 'sell' ? 'Enter USD amount' : 'Enter USD amount to receive';

        $('btcLabel').textContent = side === 'sell' ? 'Amount (Asset)' : 'Sell Amount (Asset)';
        $('amtbtc').placeholder = side === 'sell' ? 'Enter asset amount' : 'Enter asset amount to sell';
      }

      function calc(){
        const spot = parseFloat($('spot').value) || 0;
        const up = parseFloat($('upcharge').value) || 0;
        const fee = parseFloat($('txfee').value) || 0;
        const { side, isUsdInput } = getModeState();
        const usd = sumInputs('.usd-amount');
        const btc = sumInputs('.asset-amount');
        const asset= $('assetSel').value;

        $('usdTotal').textContent = usd.toFixed(2);
        $('assetTotal').textContent = fmtAsset(btc, asset);

        const sellPrice = spot * (1 + up/100);
        const buyPrice = Math.max(spot * (1 - up/100), 0);

        let usdAmount = 0;
        let assetAmount = 0;
        let lineOne = '';
        let lineTwo = '';
        let lineOneText = '';
        let lineTwoText = '';
        let rateLabel = '';
        let rateText = '';

        // Always label this as Upcharge, per latest direction.
        const spreadLabel = 'Upcharge';

        if (side === 'sell'){
          if (isUsdInput){
            const net = Math.max(usd - fee, 0);
            usdAmount = usd;
            assetAmount = sellPrice ? net / sellPrice : 0;
          } else {
            assetAmount = btc;
            usdAmount = (assetAmount * sellPrice) + fee;
          }

          lineOne = `YOUR PAYMENT <span class="big">${fmtMoney(usdAmount)}</span> <span class="muted">USD</span>`;
          lineTwo = `YOU RECEIVE <span class="huge">${fmtAsset(assetAmount, asset)}</span> <span class="muted">${asset}</span>`;

          lineOneText = `YOUR PAYMENT: ${fmtMoney(usdAmount)} USD`;
          lineTwoText = `YOU RECEIVE: ${fmtAsset(assetAmount, asset)} ${asset}`;

          rateLabel = `${fmtMoney(sellPrice)} <span class="muted">/ ${asset}</span>`;
          rateText = `${fmtMoney(sellPrice)} / ${asset}`;

          lastShareTitle = `${fmtAsset(assetAmount, asset)} ${asset}`;
        } else {
          if (isUsdInput){
            usdAmount = usd;
            assetAmount = buyPrice ? (usdAmount + fee) / buyPrice : 0;
          } else {
            assetAmount = btc;
            usdAmount = Math.max((assetAmount * buyPrice) - fee, 0);
          }

          lineOne = `YOU SEND <span class="huge">${fmtAsset(assetAmount, asset)}</span> <span class="muted">${asset}</span>`;
          lineTwo = `YOU RECEIVE <span class="big">${fmtMoney(usdAmount)}</span> <span class="muted">USD</span>`;

          lineOneText = `YOU SEND: ${fmtAsset(assetAmount, asset)} ${asset}`;
          lineTwoText = `YOU RECEIVE: ${fmtMoney(usdAmount)} USD`;

          rateLabel = `${fmtMoney(buyPrice)} <span class="muted">/ ${asset}</span>`;
          rateText = `${fmtMoney(buyPrice)} / ${asset}`;

          lastShareTitle = `${fmtMoney(usdAmount)} payout`;
        }

        currentQuote = {
          side,
          asset,
          usdAmount,
          assetAmount,
          rateText,
          up,
          feeText: moneyTrim(fee),
          lineOneText,
          lineTwoText
        };

        $('qBox').innerHTML = `
          <div class="quote-main">
            <div class="line">${lineOne}</div>
            <div class="line">${lineTwo}</div>
            <div class="line">${rateLabel}</div>
            <div class="line">${spreadLabel}: <span class="big">${up}%</span></div>
            <div class="line">Tx Fee: <span class="big">${moneyTrim(fee)}</span></div>
            <div class="line muted">${new Date().toLocaleString()}</div>
            <div class="line muted" style="font-size:0.72rem;margin-top:8px;">Quote valid for 15 minutes. Price subject to market movement.</div>
          </div>`;
      }

      async function fetchPrice(asset){
        const pair = ASSET_PAIRS[asset];
        const r = await fetch(`https://api.kraken.com/0/public/Ticker?pair=${pair}`,{cache:'no-store'});
        const j = await r.json();
        const key = Object.keys(j.result || {})[0];
        return parseFloat(j.result?.[key]?.c?.[0]);
      }

      async function fetchAsset(){
        const asset = $('assetSel').value;
        const s = $('priceStatus');
        s.textContent = `Fetching ${asset}…`;
        try{
          const price = await fetchPrice(asset);
          $('spot').value = price.toFixed(2);
          s.textContent = `${asset} updated • $${price.toFixed(2)}`;
          calc();
        }catch(e){
          s.textContent = 'Fetch failed';
          calc();
        }
      }

      function startCountdown(){
        $('refreshCountdown').textContent = countdown;
        countdown = (countdown <= 0) ? 60 : countdown - 1;
        setTimeout(startCountdown, 1000);
      }

      function startAutoRefresh(){
        if (timer) clearInterval(timer);
        timer = setInterval(fetchAsset, 60000);
        countdown = 60;
        startCountdown();
      }

      function buildShareText(){
        const lines = [
          `${currentQuote.asset} Quote • ${new Date().toLocaleString()}`,
          currentQuote.lineOneText,
          currentQuote.lineTwoText,
          currentQuote.rateText,
          `Upcharge: ${currentQuote.up}%`,
          `Tx Fee: ${currentQuote.feeText}`
        ];

        return lines.filter(Boolean).join('\n');
      }

      $('assetSel').addEventListener('change', () => {
        savePreferences();
        fetchAsset();
      });

      ['spot','amtusd','amtbtc'].forEach(id => $(id).addEventListener('input', calc));

      ['upcharge','txfee'].forEach(id => $(id).addEventListener('input', () => {
        savePreferences();
        calc();
      }));

      $('mode').addEventListener('change', () => {
        savePreferences();
        syncMode();
        calc();
      });

      $('addUsdAmount').addEventListener('click', () => addAmountInput('usd'));
      $('addAssetAmount').addEventListener('click', () => addAmountInput('asset'));

      $('btnFetch').addEventListener('click', fetchAsset);

      $('btnShare').addEventListener('click', async () => {
        const text = buildShareText();

        if (navigator.share) {
          try{
            await navigator.share({
              title: lastShareTitle || 'Quote',
              text
            });
          }catch{}
        } else {
          await navigator.clipboard.writeText(text);
          alert('Quote copied.');
        }
      });

      $('btnShareImg').addEventListener('click', async () => {
        const canvas = await html2canvas($('quoteCard'));
        const blob = await new Promise(r => canvas.toBlob(r,'image/png'));
        const file = new File([blob],'quote.png',{type:'image/png'});
        const title = lastShareTitle || 'Quote';

        if (navigator.canShare && navigator.canShare({files:[file]})) {
          try{
            const shareImageText = currentQuote.side === 'buy'
              ? `${fmtMoney(currentQuote.usdAmount)} payout

${fmtAsset(currentQuote.assetAmount, currentQuote.asset)} ${currentQuote.asset}`
              : `${fmtAsset(currentQuote.assetAmount, currentQuote.asset)} ${currentQuote.asset}`;

            await navigator.share({
              files:[file],
              title,
              text: shareImageText
            });
          }catch{}
        } else {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'quote.png';
          a.click();
          URL.revokeObjectURL(a.href);
        }
      });

      restorePreferences();
      syncMode();
      updateAmountTotalsVisibility();
      fetchAsset();
      startAutoRefresh();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      }
    });
  </script>
</body>
</html>
